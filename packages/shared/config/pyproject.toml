[project]
name = "config"
version = "0.1.0"
description = "Package managing application configuration"
requires-python = ">=3.15"
dependencies = [
    "dependency-injector",
    "pydantic",
    "pydantic-settings"
]

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
