[project]
name = "agentic-experiments"
version = "0.1.0"
description = "Showcase project for agentic workflows"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
start = "agentic_experiments:main.main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet~=0.49.0",
    "pytest~=9.2.0",
    "pytest-asyncio~=1.5.0",
    "ruff~=0.17.5",
    "ty~=0.0.104",
]

[tool.poe]
executor.type = "uv"

[tool.poe.tasks.format]
help = "Run formatter on the codebase"
cmd = "ruff format ${check:+--check} ${path}"
args = [
    { name = "check", options = ["--check"], type = "boolean" },
    { name = "path", positional = true, default = "." },
]

[tool.poe.tasks.integration-test]
help = "Run integration tests across the whole workspace"
cmd = "pytest -m integration"

[tool.poe.tasks.lint]
help = "Run linter on the codebase"
cmd = "ruff check ${fix:+--fix} ${path}"
args = [
    { name = "fix", options = ["--fix"], type = "boolean" },
    { name = "path", positional = true, default = "." },
]

[tool.poe.tasks.test]
help = "Run all tests across the whole workspace"
sequence = ["unit-test", "integration-test"]

[tool.poe.tasks.type-check]
help = "Run type checking on the codebase"
cmd = "ty check ${verbose:+--verbose} ${path}"
args = [
    { name = "verbose", options = ["-v", "--verbose"], type = "boolean" },
    { name = "path", positional = true, default = "." },
]

[tool.poe.tasks.unit-test]
help = "Run unit tests across the whole workspace"
cmd = "pytest -m unit"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest]
addopts = ["--import-mode=importlib"]
